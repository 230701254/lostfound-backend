version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Lost & Found API — Docker Compose
#
# Usage:
#   cp .env.example .env        # fill in real secrets
#   docker compose up --build   # build & run
#   docker compose up -d        # run in background
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner          # use the final stage

    image: lostfound-api:latest

    container_name: lostfound-api

    restart: unless-stopped

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    environment:
      # ── Runtime ────────────────────────────────────────────────────────────
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}

      # ── Azure Cosmos DB ────────────────────────────────────────────────────
      cosmosConnectionString: ${cosmosConnectionString}

      # ── Azure Blob Storage ─────────────────────────────────────────────────
      blobConnectionString: ${blobConnectionString}

      # ── Google Gemini AI ───────────────────────────────────────────────────
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # ── CORS ───────────────────────────────────────────────────────────────
      # Comma-separated list of allowed origins, e.g.:
      #   ALLOWED_ORIGINS=https://yourapp.azurestaticapps.net,http://localhost:5173
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

    # Load from a .env file — values above take priority over file
    env_file:
      - .env

    # Liveness probe compatible with Docker healthcheck in Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Resource limits (tune per deployment)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # Logging — keep container logs manageable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
